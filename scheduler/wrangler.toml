name = "ftips-scheduler"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = false      # no public web address: it only runs on the timers below
preview_urls = false

# times are UTC (UK time in winter, one hour earlier than UK time in summer)
[triggers]
crons = [
  "17 6 * * *",             # daily build
  "47 15 * * *",            # afternoon build
  "40 10-22 * * SAT,SUN",     # weekends: line-up and results check every hour
  "40 16-22 * * MON-FRI",     # weekday evenings: line-up and results check every hour
]

[observability]
enabled = true     # keep a log of each run (to see why a run failed)
