# Builds the predictions pages in the cloud.
# The project is private, and GitHub's free plan has no website for private
# projects, so for now this only runs when the owner presses "Run workflow"
# and the pages can be downloaded from the run ("predictions-site").
# Security: uses only GitHub's own official actions, locked to exact versions;
# needs no passwords or keys.
name: Update predictions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-predictions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to save the prediction log back to the project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned libraries
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Make predictions
        run: python make_page.py
      - name: Save the prediction log and model settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions_log.csv model_params.json
          git diff --cached --quiet || (git commit -m "Update prediction log" && git push)
      - name: Prepare pages
        run: |
          mkdir -p _site
          cp predictions.html _site/index.html
          cp details.html _site/details.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: _site
          name: predictions-site
