# Rebuilds the predictions website every morning and afternoon (UK time).
# Security: runs only on a timer or when the owner presses "Run workflow";
# uses only GitHub's own official actions, locked to exact versions;
# needs no passwords or keys.
name: Update predictions

on:
  schedule:
    - cron: "17 6 * * *"    # about 06:17 UK
    - cron: "47 15 * * *"   # about 15:47 UK
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-predictions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to save the prediction log back to the project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned libraries
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Make predictions
        run: python make_page.py
      - name: Save the prediction log and model settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions_log.csv model_params.json
          git diff --cached --quiet || (git commit -m "Update prediction log" && git push)
      - name: Prepare website
        run: |
          mkdir -p _site
          cp predictions.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
