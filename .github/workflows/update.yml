# Builds the tips pages every morning and afternoon (UK time) and puts them
# on Cloudflare Pages: https://ftips-2eb50e.pages.dev
# Extra short checks on match days: if a game kicks off within the next hour
# or so, it rebuilds so player tips use the confirmed line-ups; if not, it
# stops after a few seconds (no upload).
# Security: runs only on its timer or when the owner presses "Run workflow";
# uses GitHub's official actions and Cloudflare's official uploader, locked to
# exact versions. The Cloudflare key lives in GitHub's encrypted Secrets,
# never in the code, and can only upload pages (nothing else on the account).
name: Update predictions

on:
  schedule:
    - cron: "17 6 * * *"    # about 06:17 UK
    - cron: "47 15 * * *"   # about 15:47 UK
    - cron: "10,40 10-22 * * 0,6"   # weekends: line-up check every 30 min
    - cron: "10,40 16-22 * * 1-5"   # weekday evenings: line-up check
  workflow_dispatch:     # also started by the Cloudflare timer job in scheduler/ (GitHub's timer is unreliable)
    inputs:
      slot:
        description: "lineup = only build if a kick-off is near"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: update-predictions
  cancel-in-progress: false

env:
  CF_PROJECT: ftips-2eb50e

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to save the prediction log back to the project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Line-up check - any kick-off soon?
        id: gate
        env:
          SCHED: ${{ github.event.schedule || inputs.slot }}
        run: |
          case "$SCHED" in
            "10,40 10-22 * * 0,6"|"10,40 16-22 * * 1-5"|lineup) ;;
            *) echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, pathlib
          from zoneinfo import ZoneInfo
          now = dt.datetime.now(ZoneInfo("Europe/London")).replace(tzinfo=None)
          lo, hi = now + dt.timedelta(minutes=5), now + dt.timedelta(minutes=75)
          log = json.loads(pathlib.Path("tips_log.json").read_text(encoding="utf-8"))
          # also build once a game has just finished (kick-off 2 to 2.5 hours ago) so results show soon
          done_lo, done_hi = now - dt.timedelta(minutes=150), now - dt.timedelta(minutes=120)
          def ko(e): return dt.datetime.strptime(e["kickoff"], "%Y-%m-%d %H:%M")
          soon = [e for e in log.values() if not e.get("replay")
                  and (lo <= ko(e) <= hi or done_lo < ko(e) <= done_hi)]
          print("go=" + ("yes" if soon else "no"))
          PY
          cat "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.13"
      - name: Install pinned libraries
        if: steps.gate.outputs.go == 'yes'
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Make predictions
        if: steps.gate.outputs.go == 'yes'
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}   # referee names (football-data.org free plan)
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}             # bookmaker prices (the-odds-api.com free plan)
        run: python make_page.py
      - name: Save the prediction log and model settings
        if: steps.gate.outputs.go == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tips_log.json model_params.json cache/espn_matches.json team_stats_params.json value_params.json learn_params.json cache/referees_fd.json player_stats_params.json bet_builder_params.json cache/odds_api.json
          git diff --cached --quiet || (git commit -m "Update tips log" && git pull --rebase && git push)
      - name: Prepare pages
        if: steps.gate.outputs.go == 'yes'
        run: |
          mkdir -p _site
          cp predictions.html _site/index.html
          cp details.html _site/details.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          printf '/*\n  X-Robots-Tag: noindex\n  X-Content-Type-Options: nosniff\n  Referrer-Policy: no-referrer\n  X-Frame-Options: DENY\n  Strict-Transport-Security: max-age=31536000; includeSubDomains\n  Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=(), usb=()\n  Cross-Origin-Opener-Policy: same-origin\n' > _site/_headers
      - name: Upload to Cloudflare Pages
        if: steps.gate.outputs.go == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not added yet; skipping upload."; exit 0
          fi
          # remove stray spaces/line breaks picked up when copying
          CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          export CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID does not look like an Account ID (should be 32 letters/numbers, a-f and 0-9). It is ${#CLOUDFLARE_ACCOUNT_ID} characters long."
            exit 1
          fi
          npx --yes wrangler@4.158.0 pages project create "$CF_PROJECT" --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4.158.0 pages deploy _site --project-name "$CF_PROJECT" --branch main --commit-dirty=true
